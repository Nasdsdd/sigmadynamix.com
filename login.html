<style>
  :root {
    /* Same tokens as the home page, resources and the legal notice. */
    --void:   #06080F;
    --navy:   #0B1223;
    --panel:  #0E1729;
    --line:   rgba(148,163,184,0.14);
    --strong: rgba(148,163,184,0.26);
    --text:   #E9EEF8;
    --muted:  #93A2BD;
    --faint:  #5C6C88;
    --blue:   #0060F8;
    --link:   #4F8CFF;
    --green:  #3ECF8E;

    --display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --body:    'Inter', 'Segoe UI', sans-serif;
    --mono:    'IBM Plex Mono', ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; }

  body {
    font-family: var(--body);
    background: var(--void);
    color: var(--text);
    font-size: 15.5px;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- background layers ---------- */
  .layer { position: fixed; inset: 0; pointer-events: none; }

  .l-gradient {
    z-index: 0;
    background: radial-gradient(circle at 50% 42%,
      rgba(0,96,248,0.10) 0%,
      rgba(6,8,15,1) 58%,
      var(--void) 100%);
  }
  .l-grid {
    z-index: 1;
    background-image:
      linear-gradient(rgba(148,163,184,0.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,0.075) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(circle at 50% 44%, #000 0%, transparent 74%);
    -webkit-mask-image: radial-gradient(circle at 50% 44%, #000 0%, transparent 74%);
  }
  .l-glow {
    z-index: 2;
    background: radial-gradient(circle 280px at 50% 42%,
      rgba(0,96,248,0.14) 0%, rgba(0,96,248,0) 70%);
  }

  header, main, footer { position: relative; z-index: 3; }

  a { color: inherit; text-decoration: none; }

  /* ---------- header ---------- */
  header { padding: 22px 40px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; transition: opacity .18s ease; }
  .brand:hover { opacity: .75; }
  .brand .mark { height: 26px; width: auto; display: block; }
  .brand .word { height: 15px; width: auto; display: block; }

  /* ---------- main ---------- */
  main {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px 56px;
  }

  .wordmark { height: 26px; width: auto; margin-bottom: 34px; }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 30px;
    box-shadow: 0 24px 60px rgba(2,6,16,0.55);
  }

  .eyebrow {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--blue); margin-bottom: 12px;
  }

  h1 {
    font-family: var(--display); font-weight: 600;
    font-size: 22px; letter-spacing: -0.015em; margin-bottom: 6px;
  }

  .lede { font-size: 13.5px; color: var(--muted); margin-bottom: 26px; line-height: 1.6; }

  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }

  input[type="email"], input[type="password"] {
    width: 100%;
    background: var(--void);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--body); font-size: 14px;
    color: var(--text);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  input::placeholder { color: var(--faint); }
  input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0,96,248,0.16);
  }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 20px 0 22px;
  }

  .remember {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--body); font-size: 13px; letter-spacing: 0;
    text-transform: none; color: var(--muted); cursor: pointer; margin: 0;
  }
  .remember input { accent-color: var(--blue); width: 14px; height: 14px; cursor: pointer; }

  .link { font-size: 13px; color: var(--muted); transition: color .18s ease; }
  .link:hover { color: var(--text); }

  button[type="submit"] {
    width: 100%;
    font-family: var(--body); font-size: 14px; font-weight: 600;
    color: #FFFFFF;
    background: var(--blue);
    border: none; border-radius: 10px;
    padding: 13px 20px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(0,96,248,0.26);
    transition: background .18s ease;
  }
  button[type="submit"]:hover { background: #1A72FF; }



  .note {
    font-size: 12.5px; color: var(--faint);
    text-align: center; margin-top: 22px; line-height: 1.65;
  }

  .back {
    display: inline-block; margin-top: 26px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--faint);
    transition: color .18s ease;
  }
  .back:hover { color: var(--muted); }

  /* ---------- footer ---------- */
  footer {
    display: flex; align-items: center; justify-content: flex-end; gap: 16px;
    padding: 24px 40px;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint);
  }
  footer a { transition: color .18s ease; }
  footer a:hover { color: var(--muted); }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--link); outline-offset: 3px; border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media (max-width: 640px) {
    header { padding: 18px 22px; }
    main { padding: 28px 22px 44px; }
    .wordmark { height: 22px; margin-bottom: 26px; }
    .card { padding: 26px 22px; }
    footer { padding: 20px 22px; font-size: 9px; letter-spacing: 0.14em; }
  }
</style>
</head>

<script>
/* ============================================================================
   Sigma Dynamix — operator sign-in.

   Each operator's data lives in data/op_<handle>.json, encrypted with AES-GCM
   under a key derived from their own password (PBKDF2-SHA256, 600k rounds).
   The password is never sent anywhere: the browser derives the key locally and
   decrypts the file it just downloaded. A wrong password fails the GCM
   authentication tag, so there is nothing to "bypass" — without the password
   the file is noise.
   ============================================================================ */
(function () {
  'use strict';

  var SESSION_KEY = 'sd.session';
  var REMEMBER_DAYS = 30;

  var form = document.getElementById('login-form');
  var emailEl = document.getElementById('email');
  var passEl = document.getElementById('password');
  var rememberEl = document.getElementById('remember');
  var submitEl = form.querySelector('button[type="submit"]');
  var submitLabel = submitEl.textContent;

  /* ---- a small status line, styled to match the card ------------------- */
  var status = document.createElement('p');
  status.id = 'login-status';
  status.setAttribute('role', 'status');
  status.setAttribute('aria-live', 'polite');
  status.style.cssText =
    'margin-top:14px;font-size:13px;line-height:1.5;min-height:1.2em;' +
    'text-align:center;opacity:0;transition:opacity .2s';
  form.appendChild(status);

  function say(msg, kind) {
    status.textContent = msg || '';
    status.style.color = kind === 'error' ? '#FF6B81'
                       : kind === 'ok' ? '#3ECF8E' : '#6E82A0';
    status.style.opacity = msg ? '1' : '0';
  }

  function busy(on, label) {
    submitEl.disabled = on;
    submitEl.textContent = on ? (label || 'Signing in…') : submitLabel;
    submitEl.style.opacity = on ? '.55' : '';
    submitEl.style.cursor = on ? 'wait' : '';
  }

  /* ---- crypto helpers -------------------------------------------------- */
  var enc = new TextEncoder();
  var dec = new TextDecoder();

  function fromB64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function sha256hex(text) {
    return crypto.subtle.digest('SHA-256', enc.encode(text)).then(function (buf) {
      return Array.prototype.map
        .call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); })
        .join('');
    });
  }

  function toB64(bytes) {
    var s = '', a = new Uint8Array(bytes);
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }

  /* Derives the key, decrypts, and hands back both. The key is kept in the
     session so the dashboard can re-fetch and re-decrypt on its own — without
     it, a signed-in operator would keep seeing the snapshot taken the day they
     signed in. Storing it is no weaker than storing the decrypted payload,
     which sits in the same place. */
  function openPayload(envelope, password) {
    var rawKey;
    return crypto.subtle
      .importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: fromB64(envelope.salt),
            iterations: envelope.iterations, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          rawKey = raw;
          return crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: fromB64(envelope.nonce) }, key, fromB64(envelope.data));
        });
      })
      .then(function (plain) {
        return { payload: JSON.parse(dec.decode(plain)), key: toB64(rawKey) };
      });
  }

  /* ---- sign in --------------------------------------------------------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var email = (emailEl.value || '').trim().toLowerCase();
    var password = passEl.value || '';

    if (!email || !password) {
      say('Enter your email and password.', 'error');
      return;
    }
    if (!window.crypto || !crypto.subtle) {
      say('This browser is too old to open your dashboard securely.', 'error');
      return;
    }

    busy(true);
    say('Checking your credentials…');

    var bust = '?v=' + Date.now();
    var handle, file;

    sha256hex(email)
      .then(function (h) {
        handle = h;
        return fetch('data/directory.json' + bust, { cache: 'no-store' });
      })
      .then(function (r) {
        if (!r.ok) throw new Error('directory');
        return r.json();
      })
      .then(function (dir) {
        var entry = dir.operators && dir.operators[handle];
        if (!entry) throw new Error('credentials');
        file = entry.file;
        return fetch('data/' + file + bust, { cache: 'no-store' });
      })
      .then(function (r) {
        if (!r.ok) throw new Error('payload');
        return r.json();
      })
      .then(function (envelope) {
        say('Decrypting your data…');
        return openPayload(envelope, password).catch(function () {
          throw new Error('credentials');
        });
      })
      .then(function (opened) {
        var payload = opened.payload;
        var session = {
          payload: payload,
          key: opened.key,
          file: file,
          signedInAt: Date.now(),
          expiresAt: rememberEl && rememberEl.checked
            ? Date.now() + REMEMBER_DAYS * 864e5
            : null
        };
        var store = (rememberEl && rememberEl.checked) ? localStorage : sessionStorage;
        try {
          sessionStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(SESSION_KEY);
          store.setItem(SESSION_KEY, JSON.stringify(session));
        } catch (err) {
          throw new Error('storage');
        }
        say('Welcome back, ' + payload.name.split(' ')[0] + '.', 'ok');
        setTimeout(function () { location.href = 'dashboard.html'; }, 320);
      })
      .catch(function (err) {
        busy(false);
        passEl.value = '';
        var m = err && err.message;
        if (m === 'credentials') {
          say('That email and password combination is not recognised.', 'error');
        } else if (m === 'storage') {
          say('Your browser is blocking local storage. Allow it for this site, or turn off private browsing.', 'error');
        } else if (m === 'directory') {
          say('The portal data is unavailable right now. Contact the desk.', 'error');
        } else {
          say('Something went wrong. Check your connection and try again.', 'error');
        }
      });
  });

  /* ---- already signed in? --------------------------------------------- */
  try {
    var raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (!s.expiresAt || s.expiresAt > Date.now()) {
        say('You are already signed in — opening your dashboard…', 'ok');
        setTimeout(function () { location.href = 'dashboard.html'; }, 400);
      } else {
        sessionStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(SESSION_KEY);
      }
    }
  } catch (e) { /* ignore */ }

  /* ---- password reset is a desk operation ----------------------------- */
  var forgot = document.querySelector('.link');
  if (forgot) {
    forgot.addEventListener('click', function (e) {
      e.preventDefault();
      say('Passwords are issued by the desk. Contact Sigma Dynamix to have yours reset.');
    });
  }
})();
</script>
