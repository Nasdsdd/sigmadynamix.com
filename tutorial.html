<style>
:root{
  --void:#080c17;--navy:#0f1728;--line:rgba(140,163,197,.14);
  --text:#e9eef8;--muted:#93a2bd;--blue:#0060f8;--link:#4f8cff;--amber:#f0b429;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  height:60px;padding:0 24px;border-bottom:1px solid var(--line);
  background:rgba(8,12,23,.9);backdrop-filter:blur(12px);flex:none;
}
.back{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}
.back:hover{color:var(--text)}
.ttl{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
#frame{flex:1;width:100%;border:none;background:#fff;display:none}
.state{flex:1;display:grid;place-items:center;padding:40px;text-align:center}
.state p{color:var(--muted);max-width:44ch;margin:12px 0 0;font-size:14.5px}
.state h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;margin:0}
.state.err h2{color:var(--amber)}
.spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn{display:inline-block;margin-top:18px;border:1px solid var(--blue);border-radius:9px;
  padding:9px 18px;font-size:14px;color:var(--link)}
.btn:hover{background:rgba(0,96,248,.12)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:640px){.exp{display:none}.bar{padding:0 16px}}
</style>

<script>
const CFG = {
  SUPABASE_URL : "https://jkpycxekmljbomkdhfhc.supabase.co",
  ANON_KEY     : "sb_publishable_T1pafKvZ69IHji77doaGSw_3JTsSQS9",
  FUNCTION     : "get-resource",
};

/* Titres affichés dans la barre — mêmes identifiants que dans resources.html */
const TITLES = {
  "connection"  :"Connecting to the platform",
  "workspace"   :"Setting up your workspace",
  "trading"     :"Trading a session",
  "server-setup":"Server setup",
  "faq"         :"Trader FAQ",
};

const SKEY = "sdx_access_code";
function accessCode(){
  const m = location.hash.match(/[#&]k=([^&]+)/i);
  if (m){
    const c = decodeURIComponent(m[1]).trim().toUpperCase();
    try{ sessionStorage.setItem(SKEY, c); }catch{}
    history.replaceState(null, "", location.pathname + location.search);
    return c;
  }
  try{ return sessionStorage.getItem(SKEY); }catch{ return null; }
}

function fail(title, msg){
  document.getElementById("state").className = "state err";
  document.getElementById("state").innerHTML =
    `<div><h2>${title}</h2><p>${msg}</p><a class="btn" href="resources.html">Back to resources</a></div>`;
}

(async () => {
  const id = new URLSearchParams(location.search).get("t");
  document.getElementById("ttl").textContent = TITLES[id] || "Tutorial";

  if (!id) return fail("No tutorial selected", "Pick a tutorial from the resources page.");

  const code = accessCode();
  if (!code) return fail("Access code required",
    "Open this tutorial from the resources page, using the link Sigma Dynamix sent you.");

  const state = document.getElementById("state");
  const setStatus = t => { const h = state.querySelector("h2"); if (h) h.textContent = t; };

  try{
    // 1. Trois liens signés : la page du tutoriel, la vidéo, la narration.
    const r = await fetch(`${CFG.SUPABASE_URL}/functions/v1/${CFG.FUNCTION}?apikey=${CFG.ANON_KEY}`, {
      method:"POST", headers:{ "Content-Type":"text/plain" },
      body: JSON.stringify({ code, kind:"tutorial", id })
    });
    const d = await r.json();
    if (!r.ok || !d.page) throw new Error(d.error || "This tutorial is unavailable.");

    // 2. La page est légère (~430 Ko) : on la récupère et on y injecte les
    //    liens des médias. La vidéo reste sur le serveur et se lit en flux.
    setStatus("Loading player");
    const html = await fetch(d.page).then(x => {
      if (!x.ok) throw new Error("The tutorial file could not be loaded.");
      return x.text();
    });

    // Les pages sans média (guides, FAQ) sont montées telles quelles.
    const decl = html.match(/<script type="__sdx\/media">(.*?)<\/script>/);
    let patched = html;
    if (decl && d.video){
      const map = {};
      for (const [uuid, file] of Object.entries(JSON.parse(decl[1]))){
        map[uuid] = file.endsWith(".mp4") ? d.video : d.audio;
      }
      patched = html.replace("</head>",
        `<script>window.__SDX_MEDIA=${JSON.stringify(map)};<\/script></head>`);
    }

    // 3. Montage dans l'iframe via une URL blob (même origine que cette page).
    const frame = document.getElementById("frame");
    const blobUrl = URL.createObjectURL(new Blob([patched], { type:"text/html" }));
    frame.src = blobUrl;
    frame.onload = () => {
      state.style.display = "none";
      frame.style.display = "block";
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    };

    // 4. Compte à rebours de validité des liens.
    let left = d.expiresIn || 900;
    const exp = document.getElementById("exp");
    const tick = () => {
      if (left <= 0){ exp.textContent = "Access expired, reload the page"; return; }
      const m = Math.floor(left/60), sec = String(left%60).padStart(2,"0");
      exp.textContent = `Access expires in ${m}:${sec}`;
      left--; setTimeout(tick, 1000);
    };
    tick();
  }catch(e){
    fail("Could not open the tutorial",
      e.message === "Failed to fetch" ? "Check your connection and try again." : e.message);
  }
})();
</script>
